<!DOCTYPE html>
<html lang="es">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <style>
        :root { 
            --primary: rgba(48,99,251,1);
            --secondary: rgba(0,0,0,0.25);
            --dark: rgba(0,0,0,0.79);
            --grey: rgba(217,217,217,1);
            --darkgrey: rgba(192, 187, 187, 0.25);
        }
        body {
            margin: 0; 
            width: 100%;
            height: 100vh; 
            overflow: hidden;
            background-image: url('../static/fondo.jpeg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-wrapper {
            width: 400px;
            background-color: var(--darkgrey);
            border-radius: 10px;
            border: 1px solid var(--grey);
            filter: blur(0.3px);
            box-shadow: 2px 2px 12px 4px var(--secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            text-align: center;
        }
        h2 {
            font-family: sans-serif;
            color: #fff;
            font-size: 50px;
            margin: 0; 
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            height: 40px;
            background-color: var(--secondary);
            border: none;
            text-indent: 20px;
            outline: none;
            color: #fff;
            font-family: sans-serif;
            border-radius: 5px;
            outline: none;
        }
        input::placeholder {
            color: #fff;
            font-family: sans-serif;
        }
        button {
            width: 70%;
            height: 40px;
            background-color: var(--primary);
            color: #fff;
            padding: 10px 20px;
            border: none;
            outline: none;
            cursor: pointer;
            border-radius: 6px;
            font-family: sans-serif;
            font-size: 16px;
            transition: background 0.5s;
            margin-top: 10px;
        }
        button:hover {
            background-color: rgba(50,200,100,1);
        }
        button:active {
            background-color: rgba(40,180,90,1);
        }
        .register-button {
            background-color: rgba(50,200,100,1);
        }
        .register-button:hover {
            background-color: rgba(40,180,90,1);
        }
    </style>
</head>
<body>
    <div class="form-wrapper">
        <h2>Registro</h2>
        <form action="registro.php" method="POST">
            <input type="text" name="username" placeholder="Usuario" required>
            <input type="text" name="password" placeholder="Fecha de nacimiento" required>
            <button type="submit">Registrarse</button>
        </form>
    </div>
</body>
</html>
